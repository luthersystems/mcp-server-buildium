[project]
name = "mcp-server-buildium"
version = "0.1.0"
description = "Buildium MCP Server with FastMCP - API key authentication"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Luther Systems", email = "info@luthersystems.com" }
]
license = { text = "MIT" }
keywords = ["mcp", "buildium", "property-management", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=4,<5",
    "mcp>=2,<3",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    # pydantic-settings reads the optional .env file with python-dotenv.
    "python-dotenv>=1.2.2",
    "python-dateutil>=2.8.2",
    # Floors below clear published advisories (pip-audit in CI).
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-python-dateutil",
]

[project.scripts]
mcp-server-buildium = "mcp_server_buildium.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_buildium"]
# The generator's own tests and docs are not needed to run the server.
exclude = [
    "src/mcp_server_buildium/buildium_sdk/test",
    "src/mcp_server_buildium/buildium_sdk/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=mcp_server_buildium",
    "--cov-report=term-missing",
]

[tool.coverage.run]
# The generated SDK is exercised through the tools, not tested on its own.
omit = ["*/buildium_sdk/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/mcp_server_buildium/buildium_sdk"]  # Exclude generated SDK from linting

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",
    "B",      # bugbear
    "S",      # bandit security checks
    "ASYNC",  # async misuse
    "SIM",    # simplifications
    "RUF",    # ruff-specific
    "PT",     # pytest style
    "T20",    # stray print()
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.mypy]
python_version = "3.11"
packages = ["mcp_server_buildium", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
# The generated SDK has no annotations on some helpers.
untyped_calls_exclude = ["mcp_server_buildium.buildium_sdk"]

# The generated SDK is not ours to type-check; follow it only for its types.
[[tool.mypy.overrides]]
module = ["mcp_server_buildium.buildium_sdk", "mcp_server_buildium.buildium_sdk.*"]
ignore_errors = true
implicit_reexport = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

