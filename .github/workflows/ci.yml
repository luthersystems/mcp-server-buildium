name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      # --locked fails when uv.lock is out of date with pyproject.toml.
      - name: Install
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      # The integration tests skip themselves without Buildium credentials.
      - name: pytest
        run: uv run pytest --ignore=tests/test_integration.py

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Build
        run: uv build
      # connectorhub runs the server with `uvx --from git+...`; check that the
      # built wheel installs and its entry point imports.
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import mcp_server_buildium.server as s; assert len(s.CATEGORIES) == 12"

  # Runs against the real Buildium API only where the repository's secrets
  # are available (pushes to main and same-repository pull requests).
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BUILDIUM_BASE_URL: ${{ secrets.BUILDIUM_BASE_URL }}
      BUILDIUM_CLIENT_ID: ${{ secrets.BUILDIUM_CLIENT_ID }}
      BUILDIUM_CLIENT_SECRET: ${{ secrets.BUILDIUM_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Install
        run: uv sync --locked --extra dev
      - name: pytest (integration)
        run: |
          if [ -z "$BUILDIUM_CLIENT_ID" ] || [ -z "$BUILDIUM_CLIENT_SECRET" ]; then
            echo "::notice::Buildium credentials are not configured; skipping the integration tests."
            exit 0
          fi
          uv run pytest tests/test_integration.py --no-cov -v
